<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Aprendendo Formulários</h1>
    <form action="cadastros.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexomasc" value="M"> <label for="isexomasc">Masculino</label> <br>
            <input type="radio" name="sexo" id="isexofem" checked value="F"> <label for="isexofem">Feminino</label>
        </fieldset>


        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esportefut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esportenat" id="iesnat"> <label for="iesnat">Natação</label> <br>
            <input type="checkbox" name="esporteten" id="iesten"> <label for="iesten">Tênis</label> <br>
            <input type="checkbox" name="esportebas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
        </fieldset>


        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
