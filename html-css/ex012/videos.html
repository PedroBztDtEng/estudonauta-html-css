<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo Vídeos Hospedados Localmente</h1>
    <h2>Este vídeo está hospedado no meu próprio servidor</h2>

    <video width="560" controls autoplay loop>
        <source src="midia/Cavalo3.mp4" type="video/mp4">
        <source src="midia/Cavalo2.mp4" type="video/mp4">
        <source src="midia/Cavalo.webm" type="video/webm">
        <source src="midia/cavalo.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>

    <h1>Inserindo Vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/QnhfT7uP5FA?si=YKcl3Fctm48-loBK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
